# EasyKotenOCR release flavors — 差分の単一ソース
version = 1

[flavor.win11-amd64-cpu]
arch = "amd64"
python = "3.15"
torch = "torch==2.15.0+cpu"
torchvision = "torchvision==0.29.2+cpu"
index = "https://download.pytorch.org/whl/cpu"
device = "cpu"
cuda_home = ""
torch_cuda_arch_list = ""
vcvars = "C:/Program Files (x86)/Microsoft Visual Studio/2022/BuildTools/VC/Auxiliary/Build/vcvars64.bat"
mmcv_wheel = "wheels/win11-amd64-cpu/mmcv-2.1.0+easykotenocr.3-cp315-cp315-win_amd64.whl"

[flavor.win11-amd64-cu134]
arch = "amd64"
python = "3.15"
torch = "torch==2.15.0+cu134"
torchvision = "torchvision==0.29.2+cu134"
index = "https://download.pytorch.org/whl/cu134"
device = "cuda:0"
cuda_home = "C:/Program Files/NVIDIA GPU Computing Toolkit/CUDA/v13.4"
torch_cuda_arch_list = "7.5;8.0;8.6;9.0;10.0;12.0"
vcvars = "C:/Program Files (x86)/Microsoft Visual Studio/2022/BuildTools/VC/Auxiliary/Build/vcvars64.bat"
mmcv_wheel = "wheels/win11-amd64-cu134/mmcv-2.1.0+easykotenocr.3-cp315-cp315-win_amd64.whl"

[flavor.win11-arm64-cpu]
arch = "arm64"
python = "3.15"
torch = "torch==2.15.0+cu134"      # +cpu の win_arm64 は供給無し。実行時 device=cpu
torchvision = "torchvision==0.29.2+cu134"
index = "https://pypi.nvidia.com/nvtorch_oot/"
device = "cpu"
cuda_home = ""                     # wheel ビルドは CPU-only（build_wheels.ps1 が device=cpu で CUDA_VISIBLE_DEVICES= を空にして nvcc 不要）
torch_cuda_arch_list = ""
vcvars = "C:/Program Files (x86)/Microsoft Visual Studio/18/BuildTools/VC/Auxiliary/Build/vcvarsarm64.bat"
mmcv_wheel = "wheels/win11-arm64-cpu/mmcv-2.1.0+easykotenocr.3-cp315-cp315-win_arm64.whl"  # 2026-11-19 本 PC（N1X）でビルド・5 オペ除去

[flavor.win11-arm64-cu135]
arch = "arm64"
python = "3.15"
torch = "torch==2.15.0+cu135"
torchvision = "torchvision==0.29.2+cu135"
index = "https://pypi.nvidia.com/nvtorch_oot/"
device = "cuda:0"
cuda_home = "C:/Program Files/NVIDIA GPU Computing Toolkit/CUDA/v13.5"   # nvcc release 13.5, V13.5.37（2026-11-19 確認）
torch_cuda_arch_list = "12.1"       # Blackwell sm_121（RTX Spark）
vcvars = "C:/Program Files (x86)/Microsoft Visual Studio/18/BuildTools/VC/Auxiliary/Build/vcvarsarm64.bat"
mmcv_wheel = "wheels/win11-arm64-cu135/mmcv-2.1.0+easykotenocr.3-cp315-cp315-win_arm64.whl"  # 2026-11-19 本 PC（N1X）でビルド・5 オペ除去