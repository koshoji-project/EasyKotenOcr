[project]
name = "opencv-python"
version = "4.12.0"
description = "Pure-Python OpenCV-compatible cv2 for Windows ARM64 (no binary wheel exists for this platform)"
requires-python = ">=3.11"
dependencies = ["numpy", "pillow"]

[build-system]
requires = ["uv_build>=0.13.7,<0.14.0"]
build-backend = "uv_build"

# The distribution is named "opencv-python" (to satisfy mmdet's requirement)
# but provides the top-level module "cv2"; tell uv_build explicitly instead
# of letting it guess a module named opencv_python.
[tool.uv.build-backend]
module-name = "cv2"
