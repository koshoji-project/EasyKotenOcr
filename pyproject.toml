[project]
name = "easykotenocr"
version = "2.0.0"
description = "NDL Kotenseki OCR (EasyKotenOcr)"
readme = "README.md"
requires-python = ">=3.15,<3.16"
# ============================================================
# アプリ本体の依存定義（宣言のみ）。
# torch / torchvision / mmcv / opencv-python は ABI で flavor が変わるため
# ここでは固定しない。実際に venv を作るのは profiles/<flavor>/ 各 uv
# 経由（start_ocr.bat か uv sync --project profiles\<flavor>）。
# ルートで uv sync / uv run は実行しないこと（旧 AMD 対比スタックの
# uv.lock は廃止済み）。
# ============================================================
dependencies = [
    "albumentations==1.2.1",
    "click>=8.5.1",
    "datasets",
    "mmengine==0.10.7+easykotenocr.1",
    "mmdet==3.3.0",
    "mmpretrain==1.2.0+easykotenocr.1",
    "networkx",
    "numpy",
    "pandas",
    "pillow",
    "pyyaml>=6.0.3",
    "requests",
    "scikit-image==0.27.0rc1",
    "scikit-learn",
    "scipy",
    "tqdm",
    "transformers==4.57.6",
    "wheel>=0.48.0",
    "yaspin",
]

[build-system]
requires = ["uv_build>=0.13.7,<0.14.0"]
build-backend = "uv_build"
